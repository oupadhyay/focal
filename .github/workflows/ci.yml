name: Build Focal Android APK & Bridge Extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-and-rust:
    name: Android Debug APK + Rust adblock-rs JNI
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust + Android NDK targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache Cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/adblock-rust/rust

      - name: Install cargo-ndk prebuilt binary
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Run host Rust adblock & JNI unit tests
        working-directory: core/adblock-rust/rust
        run: cargo test --locked

      - name: Configure preinstalled Android NDK path
        run: |
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -n 1)
          echo "Using ANDROID_NDK_HOME=$NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Cross-compile libfocal_adblock.so (arm64-v8a & x86_64)
        working-directory: core/adblock-rust/rust
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t x86_64 \
            -o ../src/main/jniLibs \
            build --release --locked
          ls -lh ../src/main/jniLibs/*/*.so

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"

      - name: Assemble Focal Release (R8) + Debug + AndroidTest APKs & run JVM unit tests
        run: gradle :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest testDebugUnitTest --continue --no-daemon --stacktrace

      - name: Verify deterministic APK signature, monotonic versionCode & APK sizes
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          ls -lh app/build/outputs/apk/release/*.apk app/build/outputs/apk/debug/*.apk
          for APK in \
            app/build/outputs/apk/release/app-arm64-v8a-release.apk \
            app/build/outputs/apk/release/app-x86_64-release.apk \
            app/build/outputs/apk/debug/app-x86_64-debug.apk; do
            echo "=== Checking $APK ==="
            CERT_OUT=$("$APKSIGNER" verify --verbose --print-certs "$APK")
            echo "$CERT_OUT" | grep -q "1376db20cd4ca10c52d0a50dd6e078fc1b8c30f6145f82ed3ef40c3e03203b1f"
            "$AAPT2" dump badging "$APK" | head -n 3
          done

      - name: Stage phone APK and emulator APKs
        run: |
          mkdir -p dist-phone dist-emulator
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk dist-phone/focal-arm64-v8a.apk
          cp app/build/outputs/apk/debug/app-x86_64-debug.apk dist-emulator/app-x86_64-debug.apk
          cp app/build/outputs/apk/release/app-x86_64-release.apk dist-emulator/app-x86_64-release.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk dist-emulator/app-debug-androidTest.apk
          ls -lh dist-phone dist-emulator

      - name: Upload installable Focal Android APK (arm64-v8a R8 Release)
        uses: actions/upload-artifact@v7
        with:
          name: focal-android-apk
          path: dist-phone/focal-arm64-v8a.apk
          if-no-files-found: error

      - name: Upload x86_64 Emulator APKs (Debug + R8 Release + AndroidTest)
        uses: actions/upload-artifact@v7
        with:
          name: focal-emulator-apks
          path: dist-emulator/
          if-no-files-found: error

  android-emulator-smoke:
    name: Android API 34 Emulator End-to-End Verification
    needs: android-and-rust
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download built x86_64 Emulator APKs
        uses: actions/download-artifact@v8
        with:
          name: focal-emulator-apks
          path: apks

      - name: Enable KVM device permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Prepare emulator verification script
        run: |
          cat << 'EOF' > run-emulator-tests.sh
          #!/usr/bin/env bash
          set -euo pipefail

          adb logcat -c
          adb shell input keyevent 224 || true
          adb shell wm dismiss-keyguard || true
          adb shell settings put secure show_ime_with_hard_keyboard 1 || true
          adb install -r apks/app-x86_64-debug.apk
          adb install -r apks/app-debug-androidTest.apk

          mkdir -p emulator-screenshots
          set +e
          timeout 240 adb shell am instrument -w \
            -e class app.focal.FocalEmulatorVerificationTest \
            app.focal.test/androidx.test.runner.AndroidJUnitRunner | tee emulator-screenshots/instrument.log
          INST_EXIT=${PIPESTATUS[0]}
          set -e

          adb shell ls -la /sdcard/Android/data/app.focal/files/emulator-shots/ || true
          adb pull /sdcard/Android/data/app.focal/files/emulator-shots/. emulator-screenshots/ || true
          adb logcat -d -s AndroidRuntime:E > emulator-screenshots/android_runtime_errors.log || true
          adb logcat -d | grep -iE "app\.focal|adblock|FocalApplication|FATAL|chromium" | tail -n 150 > emulator-screenshots/focal_logcat.log || true

          if [ "$INST_EXIT" -ne 0 ] || grep -q "FAILURES!!!" emulator-screenshots/instrument.log || ! grep -q "OK (" emulator-screenshots/instrument.log; then
            echo "Instrumentation verification failed (exit=$INST_EXIT)!"
            cat emulator-screenshots/android_runtime_errors.log || true
            exit 1
          fi
          if grep -q "Process: app.focal" emulator-screenshots/android_runtime_errors.log; then
            echo "Detected fatal AndroidRuntime exception in app.focal during instrumentation!"
            cat emulator-screenshots/android_runtime_errors.log
            exit 1
          fi

          # Verify seamless in-place upgrade from debug -> R8-minified release APK & live UI rendering
          echo "=== Verifying in-place upgrade to R8 release APK ==="
          adb logcat -c
          adb install -r apks/app-x86_64-release.apk
          adb shell input keyevent 224 || true
          adb shell wm dismiss-keyguard || true

          # 1) Cold launcher start of R8 release APK (Search-First sheet)
          adb shell am start -W -n app.focal/.MainActivity -a android.intent.action.MAIN -c android.intent.category.LAUNCHER
          sleep 5
          RELEASE_PID_1=$(adb shell pidof app.focal || true)
          adb shell dumpsys window | grep -E "mCurrentFocus|mFocusedApp" > emulator-screenshots/release_window_state.log || true
          adb shell uiautomator dump /sdcard/release_ui_1.xml || true
          adb pull /sdcard/release_ui_1.xml emulator-screenshots/release_ui_1.xml || true
          adb exec-out screencap -p > emulator-screenshots/08_emulator_release_r8_cold_launch.png

          # 2) External ACTION_VIEW deep-link navigation to https://example.com in R8 release APK
          adb shell am start -W -n app.focal/.MainActivity -a android.intent.action.VIEW -d "https://example.com"
          sleep 5
          RELEASE_PID_2=$(adb shell pidof app.focal || true)
          adb shell dumpsys window | grep -E "mCurrentFocus|mFocusedApp" >> emulator-screenshots/release_window_state.log || true
          adb shell uiautomator dump /sdcard/release_ui_2.xml || true
          adb pull /sdcard/release_ui_2.xml emulator-screenshots/release_ui_2.xml || true
          adb exec-out screencap -p > emulator-screenshots/09_emulator_release_r8_webview.png

          echo "R8 release PIDs: cold=${RELEASE_PID_1:-DEAD} view=${RELEASE_PID_2:-DEAD}"
          adb logcat -d *:E > emulator-screenshots/release_all_errors.log || true
          adb logcat -d | grep -iE "app\.focal|adblock|FocalApplication|FATAL|chromium|AndroidRuntime|DEBUG|libc|Compose" | tail -n 200 > emulator-screenshots/release_logcat.log || true
          ls -lh emulator-screenshots/
          cat emulator-screenshots/release_window_state.log || true

          if [ -z "$RELEASE_PID_1" ] || [ -z "$RELEASE_PID_2" ]; then
            echo "R8 release app.focal process was not running during launch checks!"
            cat emulator-screenshots/release_all_errors.log || true
            exit 1
          fi
          if grep -qE "Process: app\.focal|Fatal signal.*app\.focal" emulator-screenshots/release_all_errors.log; then
            echo "Detected fatal crash in R8 release APK!"
            cat emulator-screenshots/release_all_errors.log
            exit 1
          fi
          if [ ! -f emulator-screenshots/release_ui_1.xml ] || ! grep -q "GitHub" emulator-screenshots/release_ui_1.xml; then
            echo "R8 release cold launch did not render SearchSheet UI!"
            cat emulator-screenshots/release_all_errors.log || true
            exit 1
          fi
          if [ ! -f emulator-screenshots/release_ui_2.xml ] || ! grep -q "example.com" emulator-screenshots/release_ui_2.xml; then
            echo "R8 release ACTION_VIEW did not render example.com WebView bar!"
            cat emulator-screenshots/release_all_errors.log || true
            exit 1
          fi
          EOF
          chmod +x run-emulator-tests.sh

      - name: Run FocalEmulatorVerificationTest on headless KVM API 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          cores: 2
          disable-animations: true
          disable-spellchecker: true
          enable-hw-keyboard: false
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          script: bash ./run-emulator-tests.sh

      - name: Upload real Android Emulator screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: focal-emulator-screenshots
          path: emulator-screenshots
          if-no-files-found: warn

  desktop-extension-and-relay:
    name: Focal Bridge MV3 Extension & E2EE Relay
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build & test Focal Bridge MV3 Extension
        working-directory: desktop-extension
        run: |
          npm ci
          npm test
          zip -r ../focal-bridge-extension.zip manifest.json dist src/popup.html src/popup.css

      - name: Build & test Stateless E2EE Sync Relay
        working-directory: sync-relay
        run: |
          npm ci
          npm test

      - name: Upload unpack-ready Focal Bridge Extension
        uses: actions/upload-artifact@v7
        with:
          name: focal-bridge-desktop-extension
          path: focal-bridge-extension.zip
          if-no-files-found: error
