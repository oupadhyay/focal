# Android 15+ (targetSdk 35) 16 KB memory page-size ELF alignment requirement.
# Ensures PT_LOAD segments in `libfocal_adblock.so` are aligned to 16384-byte boundaries
# across 64-bit Android ABIs (`arm64-v8a` and `x86_64`).

[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
