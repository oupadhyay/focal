    function buildHourglassMapURI() {
      const c = document.createElement('canvas');
      c.width = 128; c.height = 256;
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(128, 256);
      for (let y = 0; y < 256; y++) {
        const ny = (y / 255) * 2 - 1; // -1 top .. 0 waist .. +1 bottom
        const waistWeight = Math.exp(-(ny * ny) / 0.22); // peaks sharply at waist
        for (let x = 0; x < 128; x++) {
          const nx = (x / 127) * 2 - 1; // -1 left .. +1 right
          // Pull pixels inward toward x=0 at the waist; slight vertical pull toward center
          const dx = nx * waistWeight;
          const dy = ny * 0.38 * waistWeight;
          const idx = (y * 128 + x) * 4;
          img.data[idx] = Math.max(0, Math.min(255, Math.round(128 + dx * 127)));
          img.data[idx + 1] = Math.max(0, Math.min(255, Math.round(128 + dy * 127)));
          img.data[idx + 2] = 128;
          img.data[idx + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      return c.toDataURL();
    }

              <button onclick="state.overviewMode=false; setScreen(${s.id})" class="underline text-[var(--muted-foreground)]">Open Interactive -></button>
            </div>
            ${renderPhoneHTML(s.id)}
          </div>
        `).join('');
        state.pinchProgress = savedPinch;
      } else {
        mainEl.classList.remove('hidden');
        gridEl.classList.add('hidden');
        gridEl.classList.remove('grid');
        document.getElementById('device-stage').innerHTML = renderPhoneHTML(state.screen);
        renderInspector();
      }
    }

    renderAll();
  </script>
  <!-- studio-fonts: Allo Crisp (ROND 0) + Switzer Variable embedded -->
</body>
</html>
